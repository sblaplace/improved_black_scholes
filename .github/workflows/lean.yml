name: lean

# Two lanes, deliberately split:
#
#   lint  -- needs NO Lean toolchain. Enforces the syntactic half of the
#            grading rule: no `sorry` in the protected T1..T4 node, the sorry
#            ratchet, no new axioms, every stack theorem still declared, the
#            anti-vacuity independence guard (d2 not defined from d1, bsPut not
#            defined from bsCall), and the statement pins in
#            tests/golden_statements.json -- which is what notices when a
#            protected theorem is quietly restated as something provable and
#            empty. Runs in seconds, on any runner, and in any sandbox --
#            including ones where elan cannot be installed at all.
#
#   build -- the real thing. Installs elan, fetches the Mathlib olean cache,
#            runs `lake build`. This is the authority on whether the proofs
#            are correct. It needs network access to the Lean release CDN and
#            to Mathlib's cache; a sandbox without it cannot substitute for
#            this job, only for `lint`.
#
# A green `lint` with a red `build` means: the tree is honestly labelled but a
# proof is wrong. A red `lint` means: do not trust anything the build says yet.
# A green `lint` *and* a green `build` still leaves one question open -- whether
# a landed theorem says what the ledger claims -- and that is what the pins are
# for: `lake build` grades validity, the pins grade the claim.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # needed so a failed `lake build` can publish its own log back to the PR.
  # Actions logs live on Azure blob / *.githubusercontent.com hosts, which are
  # unreachable from a restricted sandbox -- so a contributor (human or agent)
  # working a brief there can see that the build is red but not *why*, and
  # cannot iterate at all. Posting the log to the PR makes it readable through
  # api.github.com, which is reachable. Without this the CI-only acceptance bar
  # is unusable precisely where the toolchain CDN is unreachable (see BRIEF_001's
  # correction record).
  pull-requests: write

jobs:
  lint:
    name: lint (no toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lean tree lint (sorry ratchet, protected node, independence guard)
        run: python3 scripts/lean_lint.py

      - name: Toolchain pin consistency
        # A mismatched pin is the classic way to turn a 3-minute cached build
        # into a 3-hour from-source one, and the failure looks like a timeout
        # rather than a config error. Check it before spending the runner.
        run: |
          set -euo pipefail
          tc="$(tr -d '[:space:]' < lean-toolchain)"
          man_fixed="$(python3 -c 'import json;print(json.load(open("lake-manifest.json"))["fixedToolchain"])')"
          man_rev="$(python3 -c 'import json;p=json.load(open("lake-manifest.json"))["packages"];print([x for x in p if x["name"]=="mathlib"][0]["inputRev"])')"
          lake_rev="$(python3 -c 'import tomllib;print(tomllib.load(open("lakefile.toml","rb"))["require"][0]["rev"])')"
          echo "lean-toolchain      = $tc"
          echo "manifest fixed      = $man_fixed"
          echo "manifest mathlib rev= $man_rev"
          echo "lakefile mathlib rev= $lake_rev"
          [ "$man_rev" = "$lake_rev" ] || { echo "FAIL: lakefile.toml and lake-manifest.json pin different mathlib revisions"; exit 1; }
          case "$tc" in *"${man_rev#v}"*) ;; *) echo "FAIL: lean-toolchain ($tc) does not match mathlib $man_rev"; exit 1 ;; esac
          echo "OK: toolchain and mathlib pins agree"

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean-lint-failure
          path: |
            .github/lean_lint_baseline.json
            ImprovedBS/
          if-no-files-found: ignore

  build:
    name: lake build (mathlib)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      # The Mathlib olean cache is multi-gigabyte and the ubuntu-latest image
      # arrives with several gigabytes of toolchains this job will never touch.
      # Run 35508440392 died with
      #   System.IO.IOException: No space left on device
      # inside the cache step, which killed the runner worker outright -- so no
      # step after it could report anything, including the log-publishing step
      # below. That is an *incident*, not a *verdict* (see benchmarks/LEDGER.md),
      # and it is invisible unless disk is measured explicitly. Hence this step.
      - name: Free runner disk and report it
        run: |
          set -uo pipefail
          df -h /home/runner || true
          # Large, unused by a Lean build. Guarded so a missing path is not fatal.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "--- after ---"
          df -h /home/runner || true
          avail_kb=$(df -Pk /home/runner | awk 'NR==2 {print $4}')
          echo "available: $((avail_kb / 1024 / 1024)) GiB"
          if [ "$avail_kb" -lt 8388608 ]; then
            echo "::error::less than 8 GiB free after cleanup -- the Mathlib cache will not fit"
            exit 1
          fi

      # lean-action installs elan and fetches the Mathlib olean cache. We run
      # `lake build` ourselves in the next step so the output can be tee'd into
      # an artifact -- BRIEF_001 requires a fail artifact on a non-clean exit,
      # and the runner log is not downloadable by the grader.
      #
      # `use-github-cache: "false"` deliberately. lean-action's actions/cache of
      # `.lake` is redundant with the Mathlib olean cache and roughly doubles
      # peak disk, which is what run 35508440392 ran out of. lean-action's own
      # README points at this input when caching causes problems. The build here
      # is one small file on top of a cached mathlib, so there is nothing worth
      # caching that the oleans do not already provide.
      - name: Set up Lean + Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"

      - name: lake build
        run: |
          touch lake-build.log lean-audit.log
          set -o pipefail
          lake build 2>&1 | tee lake-build.log

      - name: Confirm the protected theorems do not rest on sorryAx
        # `lake build` succeeding is necessary but not sufficient: a theorem
        # whose proof is `sorry` still builds, it just elaborates to something
        # that depends on the `sorryAx` axiom. `#print axioms` is the built-in
        # that makes the dependency visible, so this is the mechanical form of
        # the repo's "no prose-assumed proof" rule.
        run: |
          set -euo pipefail
          cat > /tmp/Audit.lean <<'LEAN'
          import ImprovedBS

          #print axioms BSM.exp_neg_sq_even
          #print axioms BSM.erf_neg
          #print axioms BSM.Phi_add_Phi_neg
          #print axioms BSM.Phi_neg
          #print axioms BSM.t1_d1_minus_d2
          #print axioms BSM.t2_put_call_parity
          #print axioms BSM.t2_put_call_parity_spread
          -- BRIEF_003: T3, T4 and the infrastructure they rest on
          #print axioms BSM.phi_neg
          #print axioms BSM.phi_nonneg
          #print axioms BSM.phi_integrable
          #print axioms BSM.phi_add
          #print axioms BSM.integral_phi_Iic_zero
          #print axioms BSM.Phi_eq_integral_Iic
          #print axioms BSM.Phi_nonneg
          #print axioms BSM.Phi_le_one
          #print axioms BSM.integral_comp_add_right_Iic
          #print axioms BSM.Phi_le_exp_mul_Phi_add
          #print axioms BSM.d1_exponent
          #print axioms BSM.d2_exponent
          #print axioms BSM.forward_eq
          #print axioms BSM.bsCall_nonneg
          #print axioms BSM.bsPut_nonneg
          #print axioms BSM.t3_delta_identity
          #print axioms BSM.t4_call_bounds
          #print axioms BSM.t4_put_bounds
          -- BRIEF_004: the moment obstruction (T6 sub-goal 1), ImprovedBS/Levy.lean
          #print axioms BSM.ofReal_mul_tail_le_lintegral_exp_add
          #print axioms BSM.lintegral_exp_add_eq_top_of_tail_lower_bound
          #print axioms BSM.lintegral_exp_eq_top_of_tail_lower_bound
          #print axioms BSM.exp_moment_infinite_add_of_tail_lower_bound
          #print axioms BSM.exp_moment_infinite_of_tail_lower_bound
          #print axioms BSM.spot_not_integrable_of_tail_lower_bound
          #print axioms BSM.no_drift_makes_spot_integrable
          -- BRIEF_005: tempered contour integrability (T6 sub-goal 2),
          -- ImprovedBS/Fourier.lean
          #print axioms BSM.integrable_exp_neg_abs_rpow
          #print axioms BSM.cmDenom_u4_le
          #print axioms BSM.cmDenom_ne_zero
          #print axioms BSM.carrMadanKernel_integrable
          #print axioms BSM.carrMadan_price_integrable
          #print axioms BSM.gbm_carrMadanKernel_integrable
          #print axioms BSM.gbm_carrMadan_price_integrable
          -- BRIEF_006: T5, the closed form solves the BSM PDE. The two analytic
          -- inputs, the four argument-shape lemmas, the three derivatives and the
          -- two forms of the identity: all landed, so all audited. `t5_delta` is
          -- the step whose *proof* is T3's cancellation, which the [SPINE] check in
          -- scripts/lean_lint.py pins to `t3_delta_identity`.
          #print axioms BSM.hasDerivAt_erf
          #print axioms BSM.hasDerivAt_Phi
          #print axioms BSM.hasDerivAt_d_spot
          #print axioms BSM.d_tau_quotient_eq
          #print axioms BSM.hasDerivAt_d_tau
          #print axioms BSM.d1_tau_sub_d2_tau
          #print axioms BSM.t5_delta
          #print axioms BSM.t5_gamma
          #print axioms BSM.t5_tau
          #print axioms BSM.t5_bsCall_pde_tau
          #print axioms BSM.t5_bsCall_pde
          -- BRIEF_007: the closed form is the discounted risk-neutral expectation
          -- (T6 sub-goal 3a), ImprovedBS/RiskNeutral.lean. The Gaussian bridge,
          -- the tilted integrals, the payoff lemmas and the four theorems.
          #print axioms BSM.phi_eq_gaussianPDFReal
          #print axioms BSM.Phi_eq_gaussianReal_Iic
          #print axioms BSM.integral_gaussianReal_eq_integral_mul_phi
          #print axioms BSM.integral_phi
          #print axioms BSM.exp_mul_phi_eq
          #print axioms BSM.integrable_exp_mul_phi
          #print axioms BSM.integral_exp_mul_phi
          #print axioms BSM.integral_phi_Ioi
          #print axioms BSM.integral_phi_sub_Ioi
          #print axioms BSM.integral_exp_mul_phi_Ioi
          #print axioms BSM.sigma_sqrt_tau_mul_d2
          #print axioms BSM.spot_sub_strike_eq
          #print axioms BSM.max_spot_sub_strike_mul_phi
          #print axioms BSM.max_sub_swap_eq
          #print axioms BSM.integrable_spot_mul_phi
          #print axioms BSM.integral_spot_mul_phi_eq_forward
          #print axioms BSM.integrable_max_spot_sub_strike_mul_phi
          #print axioms BSM.bsCall_eq_riskNeutral_expectation
          #print axioms BSM.bsPut_eq_riskNeutral_expectation
          #print axioms BSM.bsCall_eq_gaussianReal_expectation
          #print axioms BSM.bsCall_eq_lognormal_expectation
          -- BRIEF_008: Fourier inversion of the Carr–Madan pricing kernel (T6 sub-goal 3b),
          -- ImprovedBS/Inversion.lean. Integrability, Fourier inversion formula,
          -- landing on bsCall_eq_lognormal_expectation, and real-valuedness.
          #print axioms BSM.carrMadanInversion_integrand_integrable
          #print axioms BSM.gbm_carrMadanInversion_integrable
          #print axioms BSM.dampedCallPrice_log_eq
          #print axioms BSM.undamped_dampedCallPrice
          #print axioms BSM.fourierInversion_dampedCallPrice
          #print axioms BSM.fourierInversion_dampedCallPrice_at
          #print axioms BSM.carrMadan_inversion_eq_lognormal_expectation
          #print axioms BSM.carrMadan_inversion_eq_bsCall
          #print axioms BSM.carrMadan_inversion_im_eq_zero
          #print axioms BSM.carrMadan_inversion_eq_re
          #print axioms BSM.carrMadan_inversion_re_eq_bsCall
          -- BRIEF_010: T6 at any strip law + contour correction C12,
          -- ImprovedBS/Pricing.lean
          #print axioms BSM.cmPriceKernel_eq_shift
          #print axioms BSM.gbm_contourCharFun_eq
          #print axioms BSM.gbmCharFactor_pricing_continuous
          #print axioms BSM.gbmCharFactor_pricing_norm
          #print axioms BSM.cmPriceKernel_integrable
          #print axioms BSM.gbm_cmPriceKernel_integrable
          #print axioms BSM.cmDenom_factor
          #print axioms BSM.integral_Ioi_cexp_neg_mul_eq_inv
          #print axioms BSM.ofReal_exp_eq_cexp
          #print axioms BSM.norm_cexp_I_mul_ofReal
          #print axioms BSM.strikeTransform_eq
          #print axioms BSM.integrable_strikeTransform
          #print axioms BSM.dampedModelFreeCall_eq_dampedCallPrice
          #print axioms BSM.continuous_dampedModelFreeCall
          #print axioms BSM.integrable_dampedModelFreeCall_of_exp_moment
          #print axioms BSM.fourierDampedModelFreeCall_eq
          #print axioms BSM.fourierCM_eq_fourier
          #print axioms BSM.fourierCM_inversion
          #print axioms BSM.cmPriceIntegral_eq_damped_modelFreeCall
          #print axioms BSM.carrMadan_eq_modelFreeCall
          #print axioms BSM.cmPriceIntegrand_reflect
          #print axioms BSM.carrMadan_im_eq_zero
          #print axioms BSM.carrMadan_eq_re
          #print axioms BSM.carrMadan_re_eq_modelFreeCall
          #print axioms BSM.gbm_carrMadan_eq_bsCall
          -- BRIEF_011: the CGMY exponent, its Levy measure and the moment strip
          -- (BSM-2 kit items 1-2), ImprovedBS/CGMY.lean. Expositional lemmas,
          -- the headline contour bound and its decay corollary, the
          -- instantiation of BRIEF_010's (H-decay), the strip and the Levy measure.
          -- Correction C14 is the base-reals block: the pricing line needs
          -- `α + 1 < M` alone; `G` binds only the old line `u + iα`.
          #print axioms BSM.cgmyCharFactor_add
          #print axioms BSM.cgmyCharFactor_zero
          #print axioms BSM.cgmyContour_base_left
          #print axioms BSM.cgmyContour_base_right
          #print axioms BSM.cgmyExponent_contour
          #print axioms BSM.cgmyContour_base_left_re
          #print axioms BSM.cgmyContour_base_right_re
          #print axioms BSM.cgmyOldContour_base_right_re
          #print axioms BSM.cgmyGamma_neg_eq
          #print axioms BSM.cgmyGamma_neg_neg_of_lt_one
          #print axioms BSM.cgmyGamma_neg_pos_of_one_lt
          #print axioms BSM.cgmy_cos_half_pos_of_lt_one
          #print axioms BSM.cgmy_cos_half_neg_of_one_lt
          #print axioms BSM.cgmy_tempered_prod_neg
          #print axioms BSM.cgmyTemperedRate_pos
          #print axioms BSM.cgmy_tempered_rate_neg_eq
          #print axioms BSM.cgmyTemperedConstant_nonneg
          #print axioms BSM.cgmyTemperedCorrection_nonneg
          #print axioms BSM.cgmy_cpow_re_eq
          #print axioms BSM.cgmy_norm_ge_im
          #print axioms BSM.cgmy_arg_mem
          #print axioms BSM.cgmy_cos_arg_le
          #print axioms BSM.cgmy_cpow_re_ge_of_lt_one
          #print axioms BSM.cgmy_cpow_re_le_of_one_le
          #print axioms BSM.cgmy_cpow_re_conj
          #print axioms BSM.cgmy_cpow_re_abs
          #print axioms BSM.cgmyExponent_contour_re
          #print axioms BSM.cgmyExponent_contour_re_le
          #print axioms BSM.cgmyExponent_contour_re_le_half
          #print axioms BSM.cgmy_contour_decay
          #print axioms BSM.cgmy_contour_continuous
          #print axioms BSM.cgmy_charFactor_contour_continuous
          #print axioms BSM.cgmy_cmPriceKernel_integrable
          #print axioms BSM.cgmy_contour_mem_strip
          #print axioms BSM.cgmy_numeraire_strip
          #print axioms BSM.cgmyExponent_strip
          #print axioms BSM.cgmyLevyDensity_nonneg
          #print axioms BSM.cgmyLevyDensity_pos_of_pos
          #print axioms BSM.cgmyLevyDensity_neg_of_neg
          #print axioms BSM.cgmy_levy_sq_integrable
          #print axioms BSM.cgmy_levy_far_moment
          -- BRIEF_012: the non-uniqueness witness (BSM-2 kit item 7),
          -- ImprovedBS/NonUniqueness.lean. The three-point law, the two witness
          -- laws A and B, their BRIEF_009 instantiations (parity, bounds), the
          -- headline conjunction `static_skeleton_does_not_select_measure`,
          -- mutual absolute continuity, and the martingale segment with the
          -- call exactly `p₁/2` on it. All must print
          -- `[propext, Classical.choice, Quot.sound]` and never sorryAx.
          #print axioms BSM.trinomialMeasure_apply
          #print axioms BSM.trinomialMeasure_isProbability
          #print axioms BSM.trinomialMeasure_integrable
          #print axioms BSM.trinomialMeasure_integral
          #print axioms BSM.trinomialMeasure_ae_of_atoms
          #print axioms BSM.trinomialMeasure_absolutelyContinuous_of_pos
          #print axioms BSM.witness_call_payoff_lo
          #print axioms BSM.witness_call_payoff_mid
          #print axioms BSM.witness_call_payoff_hi
          #print axioms BSM.witnessA_prob
          #print axioms BSM.witnessB_prob
          #print axioms BSM.witnessMeasureA_integral
          #print axioms BSM.witnessMeasureB_integral
          #print axioms BSM.witnessA_integrable
          #print axioms BSM.witnessB_integrable
          #print axioms BSM.witnessA_nonneg
          #print axioms BSM.witnessB_nonneg
          #print axioms BSM.witnessA_drift
          #print axioms BSM.witnessB_drift
          #print axioms BSM.witnessA_call
          #print axioms BSM.witnessB_call
          #print axioms BSM.witnessA_parity
          #print axioms BSM.witnessB_parity
          #print axioms BSM.witnessA_bounds
          #print axioms BSM.witnessB_bounds
          #print axioms BSM.witnessCall_ne
          #print axioms BSM.witnessA_ne_B
          #print axioms BSM.witness_equivalent
          #print axioms BSM.static_skeleton_does_not_select_measure
          #print axioms BSM.martingale_set_param
          #print axioms BSM.trinomial_witness_drift
          #print axioms BSM.martingale_set_eq_segment
          #print axioms BSM.martingale_set_mem
          #print axioms BSM.martingale_set_call_eq
          #print axioms BSM.martingale_set_nondegenerate
          #print axioms BSM.martingale_set_price_range
          #print axioms BSM.witnessA_mem_segment
          #print axioms BSM.witnessB_mem_segment
          LEAN
          lake env lean /tmp/Audit.lean 2>&1 | tee lean-audit.log
          if grep -q sorryAx lean-audit.log; then
            echo "FAIL: a protected theorem depends on sorryAx"
            exit 1
          fi
          echo "OK: no protected theorem depends on sorryAx"

      - name: Statement pins -- elaborated types and axioms (anti-hollowing)
        # `lake build` is the authority on whether a proof is correct. It is not
        # the authority on whether a theorem is still *the theorem*: a protected
        # node restated as `theorem t4_call_bounds ... : True := trivial` builds,
        # and has no sorryAx, because `True` is genuinely provable. The `lint` job
        # catches that by comparing statements against tests/golden_statements.json;
        # this step catches what a text comparison cannot, by re-elaborating the
        # `#check` type and `#print axioms` output of every pinned constant and
        # diffing them against the committed block. On a first run with no `elab`
        # block committed, the block to commit is printed here -- and then published
        # to the PR by the failure step below, since CI logs are the only channel a
        # toolchain-less sandbox can read.
        run: |
          set -uo pipefail
          touch lean-pins.log
          python3 scripts/pin_statements.py --elab-check 2>&1 | tee lean-pins.log
          exit ${PIPESTATUS[0]}

      - name: Oracle ↔ Lean pointwise cross-verifier (BRIEF_002)
        # Evaluates the golden parameter grid (tests/golden_grid.json) in both
        # the Lean Float evaluator and the Python numeric oracle, asserting
        # agreement across d1, d2, call, put, parity, and BOTH sides of the
        # delta identity (each side vs the oracle, and lhs vs rhs internally —
        # the twin once emitted only the LHS: benchmarks/LEDGER.md C6 item 4).
        run: |
          touch lean-crosscheck.log
          if ! lake env lean ImprovedBS/Crosscheck.lean > lean-eval.log 2>&1; then
            echo "FAIL: 'lake env lean ImprovedBS/Crosscheck.lean' failed:" | tee lean-crosscheck.log
            cat lean-eval.log | tee -a lean-crosscheck.log
            exit 1
          fi
          python3 tests/test_crosscheck.py --lean-output lean-eval.log 2>&1 | tee lean-crosscheck.log

      - name: Publish the axioms audit to the PR
        # The audit passing is the acceptance evidence for a landed node, and
        # the ledger quotes it. Artifacts and Actions logs live behind blob
        # storage that a restricted sandbox cannot reach, so put the ~2 KB of
        # `#print axioms` output where `gh api .../comments` can read it.
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
          # GITHUB_SHA is the synthetic merge commit on pull_request events;
          # the head SHA is the one a reader can find in `git log`.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          {
            echo "### Lean CI green on ${HEAD_SHA::7} — \`#print axioms\` audit"
            echo
            echo "run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat lean-audit.log
            echo '```'
            echo
            echo "_Posted by .github/workflows/lean.yml. \`sorryAx\` anywhere above would have failed the job._"
          } > /tmp/audit_body.md
          python3 - <<'PY'
          import json, os, urllib.request
          body = open('/tmp/audit_body.md').read()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json"},
              method="POST")
          urllib.request.urlopen(req)
          print(f"posted axioms audit to PR #{os.environ['PR_NUMBER']}")
          PY

      - name: Publish the failure log back to the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          {
            echo "### Lean CI failed on ${HEAD_SHA::7}"
            echo
            # Every log this job produces, labelled. Publishing only the build log
            # is how the `#print axioms` step failed invisibly on run 35509168675:
            # `lake build` was GREEN, the audit was RED, and the comment showed
            # only three expected `sorry` warnings, which reads like success.
            for log in lake-build.log lean-audit.log lean-pins.log lean-crosscheck.log; do
              [ -s "$log" ] || continue
              echo "#### \`$log\` — error lines"
              echo
              echo '```'
              grep -nE "error|sorryAx|unknown identifier|no such|Core\.lean" "$log" \
                | head -60 || echo "(no lines matched; see the tail below)"
              echo '```'
              echo
              echo "<details><summary>\`$log\` — each error with its goal context</summary>"
              echo
              echo '```'
              grep -E "^error:" -A 6 "$log" | head -400 || true
              echo '```'
              echo
              echo "</details>"
              echo
              echo "<details><summary>\`$log\` tail (last 25k characters)</summary>"
              echo
              echo '```'
              tail -c 25000 "$log"
              echo '```'
              echo
              echo "</details>"
              echo
            done
            echo
            echo "_Posted by .github/workflows/lean.yml because Actions logs are not_"
            echo "_reachable from a restricted sandbox. Do not delete this step._"
          } > /tmp/body.md
          python3 - <<'PY'
          import json, os, urllib.request
          body = open('/tmp/body.md').read()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json"},
              method="POST")
          urllib.request.urlopen(req)
          print(f"posted build log to PR #{os.environ['PR_NUMBER']}")
          PY

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-logs
          path: |
            lake-build.log
            lean-audit.log
            lean-pins.log
            lean-crosscheck.log
          if-no-files-found: ignore
